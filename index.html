<header><h1>BTC <span>Strategy Lab</span></h1><div id="px">—</div></header>
<div class="seg" id="tf"><button data-t="15m">15m</button><button data-t="1h" class="on">1h</button><button data-t="4h">4h</button></div>

<div class="card"><h3>সেটিংস</h3>
<div class="g2"><div><label>ন্যূনতম উইন রেট %</label><input id="swr" type="number"></div><div><label>ন্যূনতম প্রফিট ফ্যাক্টর</label><input id="spf" type="number" step=".1"></div>
<div><label>ক্যাপিটাল (USDT)</label><input id="scap" type="number"></div><div><label>ঝুঁকি প্রতি ট্রেডে %</label><input id="srk" type="number" step=".1"></div></div></div>
<p class="note">বড় খবরের (CPI, FOMC) আগে-পরে ট্রেড নেবেন না। এটি শুধু ব্যক্তিগত বিশ্লেষণ টুল, আর্থিক পরামর্শ নয়। ব্যাকটেস্টের ফলাফল ভবিষ্যতের গ্যারান্টি দেয় না। ডেটা: Binance পাবলিক API (শুধু বন্ধ হয়ে যাওয়া ক্যান্ডেল ব্যবহার হয়)।</p>
<script>
const $=s=>document.querySelector(s),R=(l,s)=>l?1:s?-1:0;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=Object.assign({wr:45,pf:1.2,cap:1000,rk:1,tf:'1h'},ld('set',{}));let TF=S.tf;
const H=['https://api.binance.com','https://data-api.binance.vision','https://api1.binance.com'];
async function api(p){for(const h of H){try{const r=await fetch(h+p);if(r.ok)return r.json()}catch(e){}}throw 0}
const kl=async(tf,n)=>(await api(`/api/v3/klines?symbol=BTCUSDT&interval=${tf}&limit=${n}`)).slice(0,-1).map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
/* indicators */
const ema=(a,p)=>{const k=2/(p+1);let e=a[0];return a.map((v,i)=>e=i?v*k+e*(1-k):v)};
const atr=(d,p=14)=>{let a=0;return d.map((x,i)=>{const t=i?Math.max(x.h-x.l,Math.abs(x.h-d[i-1].c),Math.abs(x.l-d[i-1].c)):x.h-x.l;return a=i<p?(a*i+t)/(i+1):(a*(p-1)+t)/p})};
const rsi=(c,p=14)=>{let g=0,l=0;return c.map((v,i)=>{if(!i)return 50;const f=v-c[i-1],u=Math.max(f,0),w=Math.max(-f,0);if(i<=p){g+=u/p;l+=w/p}else{g=(g*(p-1)+u)/p;l=(l*(p-1)+w)/p}return l?100-100/(1+g/l):100})};
const stl=(d,A,m=3)=>{let fu=0,fl=0,dr=1;return d.map((x,i)=>{const h=(x.h+x.l)/2,u=h+m*A[i],l=h-m*A[i];if(i){const p=d[i-1].c;fu=(u<fu||p>fu)?u:fu;fl=(l>fl||p<fl)?l:fl;if(dr==1&&x.c<fl)dr=-1;else if(dr==-1&&x.c>fu)dr=1}else{fu=u;fl=l}return dr})};
const vw=d=>{let pv=0,v=0,dy=-1;return d.map(x=>{const q=Math.floor(x.t/864e5);if(q!=dy){dy=q;pv=v=0}pv+=(x.h+x.l+x.c)/3*x.v;v+=x.v;return pv/v})};
function ctx(d){const c=d.map(y=>y.c),A=atr(d),e12=ema(c,12),e26=ema(c,26),ml=e12.map((v,i)=>v-e26[i]),sg=ema(ml,9),BL=[];
c.forEach((_,i)=>{if(i<19)return BL.push(c[i]);const s=c.slice(i-19,i+1),m=s.reduce((a,b)=>a+b)/20,sd=Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/20);BL.push(m-2*sd)});
const BU=c.map((_,i)=>{if(i<19)return c[i];const s=c.slice(i-19,i+1),m=s.reduce((a,b)=>a+b)/20,sd=Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/20);return m+2*sd});
return{c,A,E9:ema(c,9),E20:ema(c,20),E200:ema(c,200),R:rsi(c),M:ml.map((v,i)=>v-sg[i]),BL,BU,ST:stl(d,A),VW:vw(d)}}
/* strategies: g = group (T trend, M mean-reversion, S smart-money) */
const STR={
ema200:{n:'EMA200 পুলব্যাক',g:'T',f:(x,d,i)=>R(x.c[i]>x.E200[i]&&d[i].l<=x.E20[i]&&x.c[i]>x.E20[i],x.c[i]<x.E200[i]&&d[i].h>=x.E20[i]&&x.c[i]<x.E20[i])},
cross:{n:'EMA 9/20 ক্রস',g:'T',f:(x,d,i)=>R(x.E9[i]>x.E20[i]&&x.E9[i-1]<=x.E20[i-1],x.E9[i]<x.E20[i]&&x.E9[i-1]>=x.E20[i-1])},
vwap:{n:'VWAP রিক্লেইম',g:'T',f:(x,d,i)=>R(x.c[i]>x.VW[i]&&x.c[i-1]<=x.VW[i-1],x.c[i]<x.VW[i]&&x.c[i-1]>=x.VW[i-1])},
st:{n:'সুপারট্রেন্ড ফ্লিপ',g:'T',f:(x,d,i)=>R(x.ST[i]==1&&x.ST[i-1]==-1,x.ST[i]==-1&&x.ST[i-1]==1)},
macd:{n:'MACD ক্রস',g:'T',f:(x,d,i)=>R(x.M[i]>0&&x.M[i-1]<=0,x.M[i]<0&&x.M[i-1]>=0)},
rsi:{n:'RSI রিভার্সাল',g:'M',f:(x,d,i)=>R(x.R[i]>=35&&x.R[i-1]<35,x.R[i]<=65&&x.R[i-1]>65)},
bb:{n:'বলিঞ্জার রিভার্সাল',g:'M',f:(x,d,i)=>R(x.c[i]>x.BL[i]&&x.c[i-1]<=x.BL[i-1],x.c[i]<x.BU[i]&&x.c[i-1]>=x.BU[i-1])},
sweep:{n:'লিকুইডিটি সুইপ',g:'S',f:(x,d,i)=>{if(i<21)return 0;const s=d.slice(i-20,i),lo=Math.min(...s.map(y=>y.l)),hi=Math.max(...s.map(y=>y.h));return R(d[i].l<lo&&d[i].c>lo,d[i].h>hi&&d[i].c<hi)}},
fvg:{n:'FVG রিটেস্ট',g:'S',f:(x,d,i)=>{for(let k=2;k<=12;k++){const j=i-k;if(j<1)break;const a=d[j-1],b=d[j+1];
if(b.l>a.h&&d[i].l<=b.l&&d[i].c>a.h&&d[i].c>d[i].o)return 1;if(b.h<a.l&&d[i].h>=b.h&&d[i].c<a.l&&d[i].c<d[i].o)return -1}return 0}},
ob:{n:'অর্ডার ব্লক রিটেস্ট',g:'S',f:(x,d,i)=>{for(let k=2;k<=25;k++){const j=i-k;if(j<1)break;const m=d[j+1],z=d[j],A=x.A[j];
if(z.c<z.o&&m.c-m.o>1.5*A&&d[i].l<=z.h&&d[i].c>z.l&&d[i].c>d[i].o)return 1;if(z.c>z.o&&m.o-m.c>1.5*A&&d[i].h>=z.l&&d[i].c<z.h&&d[i].c<d[i].o)return -1}return 0}}};
/* backtest: SL 1.5 ATR, TP1 1.5R, 48 bar timeout (excluded); same-bar SL+TP counts as loss */
function bt(d,x,f){const o=[];let nx=0;for(let i=210;i<d.length-2;i++){if(i<nx)continue;const s=f(x,d,i);if(!s)continue;nx=i+6;const e=d[i].c,r=1.5*x.A[i];let w=null;
for(let j=i+1;j<Math.min(i+49,d.length);j++){const sl=s>0?d[j].l<=e-r:d[j].h>=e+r,tp=s>0?d[j].h>=e+1.5*r:d[j].l<=e-1.5*r;if(sl){w=0;break}if(tp){w=1;break}}
if(w!==null)o.push({s,w,i})}return o}
const stat=(t,d,a,b)=>{const q=t.filter(y=>y.s==d&&y.i>=a&&y.i<b),n=q.length,w=q.filter(y=>y.w).length;return{n,wr:n?w/n*100:0,pf:n-w?w*1.5/(n-w):(w?9:0)}};
/* SMC bias */
function swings(d,k=3){const H=[],L=[];for(let i=k;i<d.length-k;i++){let h=1,l=1;for(let j=1;j<=k;j++){if(d[i].h<=d[i-j].h||d[i].h<=d[i+j].h)h=0;if(d[i].l>=d[i-j].l||d[i].l>=d[i+j].l)l=0}if(h)H.push(d[i].h);if(l)L.push(d[i].l)}return{H,L}}
function bias(d){const{H,L}=swings(d);if(H.length<2||L.length<2)return{b:0,s:'—',ev:'',z:''};const h1=H.at(-1),h0=H.at(-2),l1=L.at(-1),l0=L.at(-2),c=d.at(-1).c;
const hh=h1>h0,hl=l1>l0;let b=hh&&hl?1:!hh&&!hl?-1:0,s=b>0?'HH-HL':b<0?'LH-LL':'রেঞ্জ',ev='';
if(c>h1){ev=b<0?'CHoCH ↑':'BOS ↑';b=1}else if(c<l1){ev=b>0?'CHoCH ↓':'BOS ↓';b=-1}
return{b,s,ev,z:c>(h1+l1)/2?'Premium':'Discount'}}
/* ===== v2: গ্রেডিং, সেশন, ফান্ডিং, জার্নাল ===== */
const f$=v=>v.toLocaleString('en-US',{maximumFractionDigits:0}),cls=b=>b>0?'up':b<0?'dn':'mu',nm=b=>b>0?'বুলিশ':b<0?'বেয়ারিশ':'নিরপেক্ষ',gc={A:'up',B:'gd',C:'mu'};
let J=ld('jr',[]),CUR=null;
const sess=t=>{const h=new Date(t).getUTCHours();return h>=13&&h<18?{p:10,n:'লন্ডন+নিউ ইয়র্ক সেশন'}:(h>=7&&h<13)||(h>=18&&h<21)?{p:5,n:'একক সেশন'}:{p:0,n:'এশিয়া/ঘুমন্ত সময়'}};
async function fut(){let r=null,oi=null;const u='https://fapi.binance.com';
try{r=+(await(await fetch(u+'/fapi/v1/premiumIndex?symbol=BTCUSDT')).json()).lastFundingRate*100}catch(e){}
try{const b=await(await fetch(u+'/futures/data/openInterestHist?symbol=BTCUSDT&period=1h&limit=7')).json();oi=(+b.at(-1).sumOpenInterest/+b[0].sumOpenInterest-1)*100}catch(e){}return{r,oi}}
function analyze(D,F,E,fd){const bd=bias(D),bf=bias(F),be=bias(E),x=ctx(E),n=E.length,sp=Math.floor(n*.6),rows=[];
for(const k in STR){const s=STR[k],t=bt(E,x,s.f),r={k,n:s.n,g:s.g,now:[n-1,n-2].map(i=>s.f(x,E,i)).find(v=>v)||0};
for(const d of[1,-1]){const a=stat(t,d,0,n),o=stat(t,d,sp,n);r['s'+d]=a;r['ok'+d]=a.n>=15&&a.wr>=S.wr&&a.pf>=S.pf&&(o.n<5||o.pf>=1)}rows.push(r)}
const sc=2*bd.b+bf.b,B=sc>=2?1:sc<=-2?-1:0,dir=B||bf.b||bd.b||(x.c[n-1]>x.E200[n-1]?1:-1);
const f=rows.filter(r=>r.now==dir&&r['ok'+dir]),g=new Set(f.map(r=>r.g)),sw=rows.find(r=>r.k=='sweep'),ss=sess(E[n-1].t),P=[],add=(p,t)=>P.push([p,t]);
if(B)add(25,'১D ও ৪H বায়াস একমত');else if(dir==bf.b||dir==bd.b)add(8,'শুধু একটি টাইমফ্রেমের বায়াস মেলে');else add(0,'পরিষ্কার বায়াস নেই');
if((dir>0&&bf.z=='Discount')||(dir<0&&bf.z=='Premium'))add(15,'দাম সঠিক জোনে ('+bf.z+')');else add(0,'দাম ভুল জোনে ('+bf.z+')');
if(sw&&sw.now==dir)add(20,'লিকুইডিটি সুইপ হয়েছে');
if((dir>0&&be.ev.includes('↑'))||(dir<0&&be.ev.includes('↓')))add(10,'স্ট্রাকচার শিফট ('+be.ev+')');
add(ss.p,ss.n);
if(g.size)add(Math.min(20,g.size*10),g.size+' গ্রুপের নির্ভরযোগ্য স্ট্র্যাটেজি একমত');else add(0,'নির্ভরযোগ্য স্ট্র্যাটেজি একমত নয়');
if(fd.r!=null){if((dir>0&&fd.r<=.005)||(dir<0&&fd.r>=.02))add(10,'ফান্ডিংয়ে ভিড় উল্টো দিকে');else if((dir>0&&fd.r>.04)||(dir<0&&fd.r<-.02))add(-10,'ফান্ডিংয়ে ভিড় একই দিকে (ট্র্যাপের ঝুঁকি)')}
const score=P.reduce((a,y)=>a+y[0],0),grade=score>=70?'A':score>=45?'B':'C';
const e=E[n-1].c,A=x.A[n-1],rc=E.slice(-10),ex=dir>0?Math.min(...rc.map(y=>y.l)):Math.max(...rc.map(y=>y.h)),r=Math.min(2.5*A,Math.max(A,Math.abs(e-ex)+.2*A));
return{bd,bf,dir,B,rows,P,score,grade,ss:ss.n,fd,t:E[n-1].t,fire:f.map(y=>y.n),wr:f.length?f.reduce((a,y)=>a+y['s'+dir].wr,0)/f.length:0,setup:{e,sl:e-dir*r,t1:e+dir*r*1.5,t2:e+dir*r*3,r}}}
function resolve(E){let ch=0;J.forEach(x=>{if(x.r!=null||x.tf!=TF)return;let be=0;const L=x.d>0;for(const c of E){if(c.t<=x.t)continue;const sl=be?x.e:x.sl;if(L?c.l<=sl:c.h>=sl){x.r=be?.75:-1;break}if(!be&&(L?c.h>=x.t1:c.l<=x.t1))be=1;if(be&&(L?c.h>=x.t2:c.l<=x.t2)){x.r=2.25;break}}if(x.r!=null)ch=1});if(ch)sv('jr',J)}
function logTrade(){const o=CUR,s=o.setup;if(J.some(x=>x.t==o.t&&x.tf==TF))return;J.unshift({t:o.t,tf:TF,d:o.dir,g:o.grade,e:s.e,sl:s.sl,t1:s.t1,t2:s.t2,s:o.fire,r:null});sv('jr',J);draw(o,window.EE)}
function clearJ(){if(confirm('পুরো জার্নাল মুছবেন?')){J=[];sv('jr',J);draw(CUR,window.EE)}}
function draw(o,E){window.EE=E;resolve(E);const s=o.setup,d=o.dir,rk=o.grade=='A'?S.rk:o.grade=='B'?S.rk/2:0,q=rk?S.cap*rk/100/s.r:0,td=new Date().toDateString(),lock=J.filter(x=>x.r<0&&new Date(x.t).toDateString()==td).length>=2;
let h=lock?'<div class="card dn"><b>আজকের মতো ট্রেড বন্ধ।</b> আজ দুটো SL হয়েছে, কাল নতুন করে শুরু করুন।</div>':'';
h+=`<div class="row" style="margin-top:12px"><div class="chip"><small>১D বায়াস</small><b class="${cls(o.bd.b)}">${nm(o.bd.b)}</b><small>${o.bd.s} ${o.bd.ev}</small></div>
<div class="chip"><small>৪H বায়াস</small><b class="${cls(o.bf.b)}">${nm(o.bf.b)}</b><small>${o.bf.s} ${o.bf.ev}</small></div>
<div class="chip"><small>৪H জোন</small><b>${o.bf.z||'—'}</b><small>${o.ss}</small></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="big ${cls(d)}">${d>0?'▲ LONG':'▼ SHORT'}</div><div class="mu" style="font-size:13px">স্কোর ${o.score}/110</div></div><div class="gr ${gc[o.grade]}">${o.grade}</div></div>
<div style="font-size:13px;margin-top:8px" class="${gc[o.grade]}">${o.grade=='A'?'শক্ত সেটআপ: পুরো ঝুঁকি ('+S.rk+'%)':o.grade=='B'?'মাঝারি: অর্ধেক ঝুঁকি ('+S.rk/2+'%)':'দুর্বল: নেবেন না, শুধু ডেমো/পর্যবেক্ষণ'}</div>
<ul class="r">${o.P.map(y=>`<li><b class="${y[0]>0?'up':y[0]<0?'dn':'mu'}">${y[0]>0?'+':''}${y[0]}</b> ${y[1]}</li>`).join('')}</ul>
<div class="lv"><div><small>এন্ট্রি</small><b>${f$(s.e)}</b></div><div><small>স্টপ লস</small><b class="dn">${f$(s.sl)}</b></div>
<div><small>TP1 (১:১.৫): অর্ধেক বের হন, SL এন্ট্রিতে আনুন</small><b class="up">${f$(s.t1)}</b></div><div><small>TP2 (১:৩): বাকিটা</small><b class="up">${f$(s.t2)}</b></div>
<div><small>ঝুঁকি দূরত্ব</small><b>${f$(s.r)} (${(s.r/s.e*100).toFixed(2)}%)</b></div><div><small>সাইজ</small><b>${q?q.toFixed(4)+' BTC':'—'}</b></div></div>
<div class="mu" style="font-size:12px;margin-top:8px">ফান্ডিং: ${o.fd.r==null?'অনুপলব্ধ':o.fd.r.toFixed(4)+'%'} · ওপেন ইন্টারেস্ট (৬ ঘণ্টা): ${o.fd.oi==null?'অনুপলব্ধ':(o.fd.oi>0?'+':'')+o.fd.oi.toFixed(1)+'%'}</div>
<canvas id="cv"></canvas><button class="sm" onclick="logTrade()">📒 এই ট্রেড জার্নালে রাখুন</button></div>`;
const cl=J.filter(x=>x.r!=null),op=J.length-cl.length,R2=a=>a.reduce((z,x)=>z+x.r,0);
h+=`<div class="card"><h3>জার্নাল</h3><div class="mu" style="font-size:12px">রাখা ট্রেড নিজে থেকে ফলাফল পায় (${TF} ক্যান্ডেলে)। খোলা: ${op}</div>
<table><tr><th>গ্রেড</th><th>ট্রেড</th><th>জয়%</th><th>মোট R</th></tr>${['A','B','C'].map(g=>{const q=cl.filter(x=>x.g==g),t=R2(q);return`<tr><td class="${gc[g]}">${g}</td><td>${q.length}</td><td>${q.length?Math.round(q.filter(x=>x.r>0).length/q.length*100):0}%</td><td class="${t>=0?'up':'dn'}">${t.toFixed(2)}</td></tr>`}).join('')}</table>
${J.slice(0,6).map(x=>`<div class="mu" style="font-size:12px;margin-top:6px">${new Date(x.t).toLocaleString([],{day:'numeric',month:'short',hour:'numeric'})} · ${x.d>0?'লং':'শর্ট'} · ${x.g} · ${x.r==null?'খোলা':x.r<0?'SL (-1R)':x.r<1?'TP1 তারপর BE (+0.75R)':'TP2 (+2.25R)'}</div>`).join('')}
${J.length?'<button class="sm" onclick="clearJ()">জার্নাল মুছুন</button>':''}</div>
<div class="card"><details><summary>স্ট্র্যাটেজি রিপোর্ট (${nm(o.dir)} দিক)</summary><table><tr><th>নাম</th><th>জয়%</th><th>PF</th><th>ট্রেড</th><th></th></tr>${o.rows.map(r=>{const a=r['s'+d];return`<tr class="${r.now==d&&r['ok'+d]?'fire':''}"><td>${r.n}</td><td>${a.wr.toFixed(0)}</td><td>${a.pf.toFixed(2)}</td><td>${a.n}</td><td>${r['ok'+d]?'✓':'✗'}${r.now==d?'🔥':''}</td></tr>`}).join('')}</table>
<p class="note">✓ = সীমা পার, 🔥 = এখন সিগনাল। ব্যাকটেস্ট ~১০০০ ক্যান্ডেলে, শেষ ৪০% আলাদা যাচাই।</p></details></div>`;
$('#out').innerHTML=h;chart(E,s)}
function chart(E,s){const cv=$('#cv'),dp=devicePixelRatio||1,W=cv.clientWidth,Hh=cv.clientHeight;cv.width=W*dp;cv.height=Hh*dp;const g=cv.getContext('2d');g.scale(dp,dp);
const d=E.slice(-80),L=[s.e,s.sl,s.t1,s.t2],hi=Math.max(...d.map(y=>y.h),...L),lo=Math.min(...d.map(y=>y.l),...L),p=(hi-lo)*.06,y=v=>(hi+p-v)/(hi-lo+2*p)*Hh,w=(W-58)/d.length;
d.forEach((c,i)=>{const x=i*w+w/2,u=c.c>=c.o;g.strokeStyle=g.fillStyle=u?'#2fd1a4':'#ff6b7d';g.beginPath();g.moveTo(x,y(c.h));g.lineTo(x,y(c.l));g.stroke();g.fillRect(x-w*.35,Math.min(y(c.o),y(c.c)),w*.7,Math.max(1,Math.abs(y(c.o)-y(c.c))))});
[['Entry',s.e,'#e9eefb'],['SL',s.sl,'#ff6b7d'],['TP1',s.t1,'#2fd1a4'],['TP2',s.t2,'#2fd1a4']].forEach(([n,v,c])=>{g.strokeStyle=g.fillStyle=c;g.setLineDash([5,4]);g.beginPath();g.moveTo(0,y(v));g.lineTo(W-56,y(v));g.stroke();g.setLineDash([]);g.font='10px system-ui';g.fillText(n+' '+f$(v),W-56,y(v)+3)})}
async function run(){const b=$('#go');b.disabled=1;b.textContent='বিশ্লেষণ চলছে…';try{const[D,F,E,fd]=await Promise.all([kl('1d',400),kl('4h',500),kl(TF,1000),fut()]);
const key=['v2',TF,E.at(-1).t,S.wr,S.pf].join('|');let o=ld('res');if(!o||o.key!=key){o=analyze(D,F,E,fd);o.key=key;sv('res',o)}CUR=o;draw(o,E)}
catch(e){$('#out').innerHTML='<div class="card dn">ডেটা আনা যায়নি। ইন্টারনেট চেক করুন, দরকার হলে VPN ব্যবহার করুন।</div>'}
b.disabled=0;b.textContent='🔍 ট্রেড খুঁজুন'}
async function price(){try{const r=await api('/api/v3/ticker/price?symbol=BTCUSDT');$('#px').textContent='$'+f$(+r.price)}catch(e){}}
document.querySelectorAll('#tf button').forEach(b=>{b.classList.toggle('on',b.dataset.t==TF);b.onclick=()=>{TF=S.tf=b.dataset.t;sv('set',S);document.querySelectorAll('#tf button').forEach(x=>x.classList.toggle('on',x==b));run()}});
[['swr','wr'],['spf','pf'],['scap','cap'],['srk','rk']].forEach(([id,k])=>{const e=$('#'+id);e.value=S[k];e.onchange=()=>{S[k]=+e.value||S[k];sv('set',S)}});
$('#go').onclick=run;price();setInterval(price,10000);run();
</script></body></html>
